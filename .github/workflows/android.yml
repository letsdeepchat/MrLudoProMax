name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Test and build release APK
        run: ./gradlew test :app:assembleRelease --no-daemon --stacktrace

      - name: Check offline constraints
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)/aapt2
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          if grep -q 'android.permission.INTERNET' perms.txt; then echo "INTERNET permission found"; exit 1; fi
          SIZE=$(stat -c %s "$APK"); echo "APK size: $SIZE bytes"
          test "$SIZE" -lt 26214400

      - name: Name the APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NAME="LudoSovereign-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-sovereign-apk
          path: ${{ env.APK_NAME }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screens/
          if-no-files-found: ignore

      # Every push to main (e.g. a merged PR) publishes or refreshes the Release for the app's versionName.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Ludo Sovereign ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK_NAME }}
          body_path: .github/release-notes.md
          make_latest: true
